[package]
name = "airvault_shim"
version = "0.1.0"
edition = "2021"
# The locked plist/time dependency line requires Rust 1.88.
rust-version = "1.88"
publish = false

[lib]
name = "airvault_shim"
crate-type = ["staticlib"] # -> libairvault_shim.a for cgo

[dependencies]
# OpenSSL avoids rustls' conservative TLS 1.2 AES-GCM record limit during
# multi-hundred-gigabyte restores. default-features=false keeps rustls out:
# idevice gates its openssl paths on `not(feature = "rustls")`, so a rustls
# that resolved alongside would silently take over.
idevice = { version = "0.1.68", default-features = false, features = [
    "openssl",
    "usbmuxd",
    "pair",
    "mobilebackup2",
    "diagnostics_relay",     # av_power (restart/shutdown/sleep) + battery health
    "syslog_relay",          # gates os_trace_relay too — av_console_* (device console)
    "installation_proxy",    # av_apps (list) + av_app_install (install a user .ipa)
    "springboardservices",   # av_app_icons + backup census (home-screen icon PNGs)
    "afc",                   # av_app_install stages the .ipa via AFC before installing
    "house_arrest",          # av_app_files_* reads an app's Documents container over AFC
    "notification_proxy",    # the iTunes sync-session dance around backups
    "mobileactivationd",     # av_activation_* (Setup Assistant restore needs activation)
] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "fs"] }
tokio-util = { version = "0.7.12", features = ["io"] }
thiserror = "2"
plist = "1"
# C-ABI JSON payloads (device lists, hardware info, console records).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Icon PNGs inside av_app_icons' JSON; plist already brings this version in.
base64 = "0.22.1"
# SHA-256 manifest seal plus streaming object hashes verified during restore.
sha2 = "0.10"
# HostID generation for freshly created pairing records.
uuid = { version = "1", features = ["v4"] }
# Shim + idevice diagnostics; the Go host supplies the filter and output sink.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# Paused time for the idle-pool timer tests.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "unwind"

[profile.dev]
panic = "unwind"
