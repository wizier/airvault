language = "C"
include_guard = "AIRVAULT_ENGINE_H"
cpp_compat = true
autogen_warning = "/* Generated by cbindgen 0.29.4 from the Rust C ABI. Do not edit by hand. */"
documentation = true
line_length = 100
tab_width = 2
style = "type"
usize_is_size_t = true

[parse]
parse_deps = false

[export.rename]
"BackupCb" = "av_backup_cb"
"InstallCb" = "av_install_cb"
"LogCb" = "av_log_cb"
