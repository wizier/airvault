# Uses the host's usbmuxd (macOS: /var/run/usbmuxd) when USBMUXD_SOCKET_ADDRESS
# is unset. Run with: make dev
root = "."
tmp_dir = ".air"

[build]
  # Do NOT set USBMUXD_SOCKET_ADDRESS (that's prod/netmuxd).
  cmd = "CGO_ENABLED=0 go build -o .air/airvault ./cmd/airvault"
  bin = "./.air/airvault"
  # :8081 — in dev the browser talks to Vite at :8080, which proxies /api here.
  full_bin = "AIRVAULT_LOG_LEVEL=debug AIRVAULT_LISTEN_ADDR=127.0.0.1:8081 ./.air/airvault"
  delay = 800
  include_ext = ["go", "sql"]
  exclude_dir = [".air", "bin", "data", "web/node_modules", "web/dist"]
  exclude_regex = ["_test\\.go$"]
  stop_on_error = true

[log]
  time = false
